{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>password</title>
<link rel="stylesheet" href="{% static 'css/collector.css' %}">
</head>
<body class="signin">
  <div class="console">

    <div class="console-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="console-title">{{ brand }} // passphrase</span>
    </div>

    <div class="console-body">
      {% if using_default %}
        <p class="line"><span class="prompt">!</span> <b class="warn">still on the default</b></p>
      {% endif %}

      <form method="post" action="{% url 'change-password' %}" class="console-form">
        {% csrf_token %}
        <label for="cur"><span class="prompt">&gt;</span> current</label>
        <input id="cur" type="password" name="current" autocomplete="current-password"
               required {% if not note %}autofocus{% endif %} spellcheck="false">
        <label for="new"><span class="prompt">&gt;</span> new</label>
        <input id="new" type="password" name="new" autocomplete="new-password"
               required spellcheck="false">
        <label for="again"><span class="prompt">&gt;</span> repeat</label>
        <input id="again" type="password" name="again" autocomplete="new-password"
               required spellcheck="false">
        <button type="submit">set</button>
        {% if error %}<p class="bad"><span class="prompt">!</span> {{ error }}</p>{% endif %}
        {% if note %}<p class="good"><span class="prompt">&gt;</span> changed</p>{% endif %}
      </form>
    </div>

    <div class="console-foot">
      <a href="{% url 'collector' %}">&lsaquo; console</a>
      <span class="grow"></span>
      <span>{{ brand }}</span>
    </div>

  </div>
</body>
</html>
